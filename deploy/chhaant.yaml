AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Chhaant on AWS: one Graviton4 instance running the Cloud-Optimized OpenCV
  Library (COOL) AMI, behind CloudFront. Bedrock is called with the instance
  role (no keys on disk); every run's evidence goes to S3 and its metrics to
  CloudWatch. The instance only accepts traffic from CloudFront and is managed
  through SSM (no SSH).

Parameters:
  ArtifactBucket:
    Type: String
    Description: Bucket holding artifacts/ (code tarball, model) and receiving runs/ (evidence)
  ArtifactKey:
    Type: String
    Default: artifacts/chhaant.tar.gz
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-05a336eb12c47d427
    Description: COOL for Graviton4 (OpenCV 5 with Arm KleidiCV), ap-south-1
  InstanceType:
    Type: String
    Default: c8g.large
    AllowedValues: [c8g.large, c8g.xlarge, m8g.large, m8g.xlarge]
  CloudFrontPrefixList:
    Type: String
    Default: pl-9aa247f3
    Description: com.amazonaws.global.cloudfront.origin-facing in ap-south-1
  BedrockModel:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional. The alarms email this address (it must confirm the subscription once).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: chhaant-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ArtifactBucket}/artifacts/*
              - Sid: WriteEvidence
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${ArtifactBucket}/runs/*
              - Sid: CallTheModel
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModel}
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: {cloudwatch:namespace: Chhaant}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  OriginSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Chhaant origin, reachable only from CloudFront
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourcePrefixListId: !Ref CloudFrontPrefixList
          Description: CloudFront origin-facing addresses only

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt OriginSecurityGroup.GroupId]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 60, VolumeType: gp3, Encrypted: true}  # the COOL AMI snapshot is 60 GB
      Tags:
        - {Key: Name, Value: chhaant}
        - {Key: project, Value: opencv-comp}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/chhaant-bootstrap.log 2>&1
          PY=/opt/cool/venvs/python_3.12/bin/python
          $PY -m pip install --quiet boto3==1.42.29
          $PY -c "import boto3; boto3.client('s3', region_name='${AWS::Region}').download_file('${ArtifactBucket}', '${ArtifactKey}', '/tmp/chhaant.tar.gz')"
          mkdir -p /srv/chhaant
          tar xzf /tmp/chhaant.tar.gz -C /srv/chhaant
          CHHAANT_BUCKET=${ArtifactBucket} AWS_REGION=${AWS::Region} CHHAANT_BEDROCK_MODEL=${BedrockModel} bash /srv/chhaant/deploy/bootstrap.sh

  Address:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance
      Tags:
        - {Key: Name, Value: chhaant}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Chhaant
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: chhaant-origin
            # the Elastic IP's public DNS name: ec2-a-b-c-d.<region>.compute.amazonaws.com
            DomainName: !Join ["", ["ec2-", !Join ["-", !Split [".", !Ref Address]], ".", !Ref "AWS::Region", ".compute.amazonaws.com"]]
            CustomOriginConfig:
              HTTPPort: 8000
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: chhaant-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled (live run state)
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CacheBehaviors:
          - PathPattern: /static/*
            TargetOriginId: chhaant-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4cc15a8a-d715-48a4-82b8-cc0b614638fe      # UseOriginCacheControlHeaders-QueryStrings
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /api/photo*
            TargetOriginId: chhaant-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4cc15a8a-d715-48a4-82b8-cc0b614638fe
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # ---- observability ---------------------------------------------------------
  # The app publishes per-run metrics to the Chhaant namespace (chhaant/web/aws.py);
  # health metrics also go out without a dimension so one alarm covers every run.
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Chhaant alarms

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  RunFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A run ended in an error (model call, vision or the cell itself); see runs/<id>/ in S3.
      Namespace: Chhaant
      MetricName: RunFailed
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  UnusablePhotosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >
        Runs average 3+ photos that failed the capture checks (blur, glare, exposure, empty
        turntable): the camera or the lighting needs a look. Good photos fail about 1% of the time.
      Namespace: Chhaant
      MetricName: UnusablePhotos
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  InstanceStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The instance failed a status check; the page is probably down.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlertTopic]

  InstanceRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The AWS host under the instance failed; EC2 moves it to healthy hardware (same IP and volume).
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{Name: InstanceId, Value: !Ref Instance}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:recover", !Ref AlertTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: Chhaant
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {
            "title": "Runs and failures (per hour)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
            "metrics": [["Chhaant", "RunSeconds", {"stat": "SampleCount", "label": "runs"}], [".", "RunFailed", {"label": "failed runs"}]]}},
          {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {
            "title": "Run time (s)", "region": "${AWS::Region}", "period": 3600, "view": "timeSeries",
            "metrics": [["Chhaant", "RunSeconds", {"stat": "Average", "label": "average"}], ["...", {"stat": "p90", "label": "p90"}]]}},
          {"type": "alarm", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {
            "title": "Alarms", "alarms": ["${RunFailedAlarm.Arn}", "${UnusablePhotosAlarm.Arn}", "${InstanceStatusAlarm.Arn}", "${InstanceRecoveryAlarm.Arn}"]}},
          {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
            "title": "Cell rules at work (average per run)", "region": "${AWS::Region}", "stat": "Average", "period": 3600, "view": "timeSeries",
            "metrics": [["Chhaant", "RefusedMoves", {"label": "moves the cell refused"}], [".", "UnusablePhotos", {"label": "photos failing capture checks"}],
                        [".", "PersonRequests", "Reviewer", "person", {"label": "questions to a person"}],
                        ["...", "simulated", {"label": "questions to the simulated reviewer"}]]}},
          {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
            "title": "Packed wrong vs the hidden labels (simulated reviewer runs)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
            "metrics": [["Chhaant", "PackedWrong", "Reviewer", "simulated"], [".", "ItemsInspected", ".", ".", {"label": "items inspected"}]]}},
          {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
            "title": "Language-model tokens (per hour)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600, "view": "timeSeries",
            "metrics": [["Chhaant", "InputTokens", "Reviewer", "person"], ["...", "simulated"],
                        [".", "OutputTokens", ".", "person"], ["...", "simulated"]]}},
          {"type": "metric", "x": 0, "y": 12, "width": 12, "height": 6, "properties": {
            "title": "Instance CPU (%) and status", "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
            "metrics": [["AWS/EC2", "CPUUtilization", "InstanceId", "${Instance}", {"stat": "Average"}],
                        [".", "StatusCheckFailed", ".", ".", {"stat": "Maximum", "yAxis": "right"}]]}}
        ]}

Outputs:
  Url:
    Value: !Sub https://${Distribution.DomainName}
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=Chhaant
  InstanceId:
    Value: !Ref Instance
  OriginAddress:
    Value: !Ref Address
